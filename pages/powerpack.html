<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dima's Bday PowerPack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- STYLESHEETS -->
    <link rel="stylesheet" href="/src/css/powerpacks.css">
</head>
<body>
    <div id="main-container" class="centered">
      <div class="battle-screen">
    
        <div class="platform enemy-platform">
          <div class="circle-base grass">
            <img class="enemy-sprite" src="/src/assets/img/pack.jpeg">
          </div>
        </div>

        <div class="platform player-platform">
          <div class="circle-base dirt">
            <img class="player-sprite" src="/src/assets/img/ampharos_sprite.png">
          </div>
        </div>
    
        <div class="textbox">
          <div class="textbox-border">
            <p class="textbox-text">A wild POWER PACK appeared!
              <div class="yes"></div>
            </p>
            <div class="blink-arrow"></div>
          </div>
        </div>
    
      </div>
    </div>

    <!-- SCRIPTS -->
    <script
        src="https://code.jquery.com/jquery-3.6.0.min.js"
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
        crossorigin="anonymous">
    </script>
    <script src="/src/js/powerpacks.js"></script>
</body>
</html>
